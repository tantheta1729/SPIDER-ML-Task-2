<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Information Assistant</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h2>🩺 Healthcare Information Assistant</h2>
            <p>Grounded medical answers based strictly on verified documentation</p>
        </header>

        <div class="status-panel">
            <span id="safety-badge" class="badge">Safety: Awaiting Input</span>
            <span id="confidence-badge" class="badge">Confidence: Awaiting Input</span>
        </div>

        <div class="output-box" id="output-box">
            <p class="placeholder-text">Type your question below and press submit to check medical records...</p>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="e.g., What lifestyle changes help with high blood pressure?">
            <button id="submit-btn">Search Evidence</button>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
